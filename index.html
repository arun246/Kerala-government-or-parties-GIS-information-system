<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kerala 3D OpenStreetMap View</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <section class="viewport" aria-label="Interactive 3D Kerala map">
        <div id="scene"></div>
        <div
          id="loadingOverlay"
          class="loading-overlay"
          role="status"
          aria-live="polite"
          style="position:absolute;inset:0;z-index:10;display:grid;place-items:center;"
        >
          Loading...
        </div>
        <div class="topbar">
          <div>
            <p class="eyebrow">OpenStreetMap India</p>
            <h1>Kerala 3D</h1>
          </div>
          <div class="status" id="dataStatus">Loading OSM boundary...</div>
        </div>
        <aside class="panel" aria-label="Map controls">
          <label>
            Elevation
            <input id="heightRange" type="range" min="0.2" max="2.4" value="1.1" step="0.1" />
          </label>
          <label class="check-row">
            <input id="lsgToggle" type="checkbox" checked />
            LSG Boundaries
          </label>
          <div class="segmented" aria-label="Map mode">
            <button data-mode="terrain">Terrain</button>
            <button class="active" data-mode="streets">Streets</button>
            <button data-mode="districts">Districts</button>
            <button data-mode="outline">Outline</button>
          </div>
          <button id="resetView" class="wide-button">Reset View</button>
        </aside>
        <div class="hint">Drag to rotate | Scroll to zoom | Right-drag to pan</div>
        <a class="attribution" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">
          Data: OpenDataKerala + (c) OpenStreetMap contributors
        </a>
        <aside id="detailPanel" class="detail-panel hidden" aria-label="Selected local body detail">
          <div class="detail-head">
            <div>
              <p class="eyebrow">Selected LSG</p>
              <h2 id="detailTitle">Local body</h2>
            </div>
            <button id="detailClose" class="icon-button" aria-label="Close detail panel">x</button>
          </div>
          <canvas id="detailCanvas" width="420" height="300"></canvas>
          <div id="detailInfo" class="detail-info"></div>
        </aside>
      </section>
    </main>
    <script src="./kerala_lsg_data.js"></script>
    <script src="./kerala-boundary-nominatim.js"></script>
    <script src="./kerala_pbf_places.js"></script>
    <script src="./app.js" defer></script>
  </body>
</html>
